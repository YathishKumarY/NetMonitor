name: NetMonitor
options:
  bundleIdPrefix: com.netmonitor
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.35"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  NetMonitor:
    type: application
    platform: macOS
    sources:
      - path: NetMonitor
    settings:
      base:
        INFOPLIST_FILE: NetMonitor/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetMonitor/App/NetMonitor.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.netmonitor.app
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    info:
      path: NetMonitor/App/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: NetMonitor
        CFBundleDisplayName: NetMonitor
        CFBundleIdentifier: com.netmonitor.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "14.0"
        NSMainStoryboardFile: ""

  NetMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NetMonitorTests
    dependencies:
      - target: NetMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netmonitor.tests
